<div class="filter-group bg-light rounded-pill p-1 border shadow-sm d-flex" id="timeFilterPills">
  <button class="btn btn-sm rounded-pill px-3 fw-semibold active-time bg-white text-primary shadow-sm" data-value="month">Tháng này</button>
  <button class="btn btn-sm rounded-pill px-3 fw-semibold text-muted border-0" data-value="year">Năm này</button>
  <button class="btn btn-sm rounded-pill px-3 fw-semibold text-muted border-0" data-value="all">Tất cả</button>
  <input type="hidden" id="timeFilter" value="month">
</div>
